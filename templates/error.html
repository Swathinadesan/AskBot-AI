{% extends "base.html" %}
{% block title %}{{ code }} - AskBot AI{% endblock %}
{% block body %}
<div class="ambient-bg">
  <div class="ambient-grid"></div>
</div>
<div
  style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;">
  <div style="max-width:440px;">
    <div
      style="font-family:var(--font-mono); font-size:14px; color:var(--gold); margin-bottom:14px; letter-spacing:.05em;">
      ERROR {{ code }}</div>
    <h1 style="font-size:1.9rem; margin-bottom:12px;">{{ message }}</h1>
    <p style="margin-bottom:28px;">Let's get you back on track.</p>
    <a href="{{ url_for('landing') }}" class="btn btn-primary">Back to home</a>
  </div>
</div>
{% endblock %}
