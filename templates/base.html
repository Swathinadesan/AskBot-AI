<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}AskBot AI{% endblock %}</title>

  <meta name="description"
    content="{% block description %}AskBot AI your placement and interview preparation assistant, powered by a curated knowledge base and AI.{% endblock %}">

  <!-- Theme applied before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("Placementor-theme");

        var theme = saved ||
          (window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");

        document.documentElement.setAttribute("data-theme", theme);

      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <!-- AskBot AI Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23F2B84B'/%3E%3Cpath d='M9 23 L17 15 L23 20 L31 9' stroke='%230A0E1C' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

  {% block body %}{% endblock %}

  <!-- Theme JavaScript -->
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer>
  </script>

  {% block scripts %}{% endblock %}

</body>

</html>
